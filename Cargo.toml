[package]
name = "tirtl_core"
version = "0.1.0"
edition = "2021"
description = "Rust kernels for the TIRTL-seq pairing pipeline (tirtl._core)"
license = "GPL-3.0-or-later"

[lib]
name = "_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module"] }
numpy = "0.23"
ndarray = { version = "0.16", features = ["rayon"] }
rayon = "1.10"
hashbrown = "0.15"
ahash = "0.8"
libm = "0.2"
ryu = "1.0"
memchr = "2.7"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
